# Builds the Prism instance and server starter for a vX.Y.Z tag and publishes them as a GitHub Release.
# Release flow: DEVELOPMENT.md "Releasing".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # fallback: gh workflow run release.yml --ref vX.Y.Z

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4 # build.py compiles the server launcher
        with:
          distribution: temurin
          java-version: "21"
      - name: Build release files
        run: python3 tools/release/build.py
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --title "Campfiremons $GITHUB_REF_NAME" --notes-file dist/release-notes.md
